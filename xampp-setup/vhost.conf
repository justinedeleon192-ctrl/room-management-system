# Apache Virtual Host Configuration for School Management System
# Add this to your httpd-vhosts.conf file

<VirtualHost *:80>
    DocumentRoot "C:/xampp/htdocs/school-management/public"
    ServerName school-management.local
    ServerAlias www.school-management.local
    
    <Directory "C:/xampp/htdocs/school-management/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable rewrite engine for clean URLs
        RewriteEngine On
        RewriteBase /
        
        # Redirect to index.php if file doesn't exist
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [L]
    </Directory>
    
    # Error log
    ErrorLog "logs/school-management-error.log"
    CustomLog "logs/school-management-access.log" common
    
    # PHP settings
    php_value upload_max_filesize 10M
    php_value post_max_size 10M
    php_value memory_limit 256M
    php_value max_execution_time 300
</VirtualHost>

# HTTPS Configuration (Optional - for SSL certificates)
<VirtualHost *:443>
    DocumentRoot "C:/xampp/htdocs/school-management/public"
    ServerName school-management.local
    ServerAlias www.school-management.local
    
    <Directory "C:/xampp/htdocs/school-management/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [L]
    </Directory>
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile "conf/ssl.crt/school-management.crt"
    SSLCertificateKeyFile "conf/ssl.key/school-management.key"
    
    ErrorLog "logs/school-management-ssl-error.log"
    CustomLog "logs/school-management-ssl-access.log" common
</VirtualHost>
