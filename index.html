<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Room Availability System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>CEA Room Management System</h1>
        </div>
    </header>

    <main class="login-container">
        <div class="login-content">
            <div class="login-form-section">
                <div class="login-card">
                    <h2>Login</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="form-actions">
<a href="#" class="forgot-password">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                    <p class="signup-link">
<a href="signup.html">Sign up</a>
                    </p>
                </div>
            </div>
            <div class="logo-section">
                <div class="logo-placeholder">
                    <img src="cea.png" alt="CEA Logo">
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 College of Engineering and Architecture. All rights reserved.</p>
        </div>
    </footer>

    <div id="notification" class="notification"></div>
    <script src="public/script-php.js"></script>
</body>
</html>
