<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Room Availability System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal.active { display: flex; }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 100;
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }
        .notification.show { transform: translateX(0); }
        .notification.success { background: #16a34a; }
        .notification.error { background: #dc2626; }
        .notification.warning { background: #f59e0b; color: #000; }
        .filter-btn.active {
            background: #991b1b !important;
            color: white !important;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <!-- HEADER -->
    <header class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-red-800 flex items-center space-x-2">
                <span>🏢</span> <span>CEA Room Management System</span>
            </h1>
            <div class="flex items-center space-x-4">
                <span id="currentUser" class="text-sm text-gray-600 font-medium"></span>
                <button onclick="logout()" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 text-sm font-medium transition">Logout</button>
            </div>
        </div>
    </header> 

    <!-- MAIN INTERFACE -->
    <div class="max-w-7xl mx-auto px-6 py-6 flex gap-6">
        <!-- SIDEBAR -->
        <aside class="w-64 shrink-0">
            <nav class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                <ul class="space-y-2">
                    <li><a href="#" class="flex items-center space-x-2 px-4 py-2 rounded-md bg-red-50 text-red-800 font-medium">📊 Dashboard</a></li>
                    <li><a href="calendar.html" class="flex items-center space-x-2 px-4 py-2 rounded-md text-gray-600 hover:bg-gray-50 font-medium">📅 Calendar</a></li>
                    <li><a href="view-calendar.html" class="flex items-center space-x-2 px-4 py-2 rounded-md text-gray-600 hover:bg-gray-50 font-medium">👁️ View Only</a></li>
                </ul>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold">Room Management Dashboard</h2>
                    <button onclick="openAddRoomModal()" class="px-4 py-2 bg-red-800 hover:bg-red-900 text-white rounded-md font-medium text-sm transition">+ Add Room</button>
                </div>

                <!-- FILTERS ROW -->
                <div class="flex flex-wrap items-center gap-3 mb-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <!-- Search -->
                    <input type="text" id="searchInput" placeholder="Search rooms..." class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-red-700 flex-1 min-w-[200px]">
                    
                    <!-- Status Filter -->
                    <select id="filterStatus" class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-red-700">
                        <option value="">All Status</option>
                        <option value="available">Available</option>
                        <option value="occupied">Occupied</option>
                    </select>
                    
                    <!-- Date Filter Buttons -->
                    <div class="flex bg-white border border-gray-300 rounded-md overflow-hidden">
                        <button onclick="setDateFilter('day')" id="filter-day" class="filter-btn px-3 py-2 text-sm transition">Day</button>
                        <button onclick="setDateFilter('week')" id="filter-week" class="filter-btn px-3 py-2 text-sm transition">Week</button>
                        <button onclick="setDateFilter('month')" id="filter-month" class="filter-btn px-3 py-2 text-sm transition">Month</button>
                        <button onclick="setDateFilter('all')" id="filter-all" class="filter-btn px-3 py-2 text-sm transition active">All</button>
                    </div>
                    
                    <!-- Date Display -->
                    <span id="dateFilterLabel" class="text-sm text-gray-600 font-medium"></span>
                </div>

                <!-- ANALYTICS CARDS -->
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                        <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Total Rooms</h3>
                        <p class="text-2xl font-bold text-gray-800 mt-1" id="totalRooms">0</p>
                    </div>
                    <div class="bg-green-50 rounded-lg p-4 border border-green-200">
                        <h3 class="text-xs font-semibold text-green-600 uppercase tracking-wider">Available</h3>
                        <p class="text-2xl font-bold text-green-700 mt-1" id="availableRooms">0</p>
                    </div>
                    <div class="bg-red-50 rounded-lg p-4 border border-red-200">
                        <h3 class="text-xs font-semibold text-red-600 uppercase tracking-wider">Occupied</h3>
                        <p class="text-2xl font-bold text-red-700 mt-1" id="occupiedRooms">0</p>
                    </div>
                </div>

                <!-- DATA TABLE -->
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b border-gray-200">
                                <th class="text-left py-3 px-4 font-semibold text-gray-600">Room Name</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-600">Capacity</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-600">Date</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-600">Time Slot</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-600">Instructor</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-600">Status</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-600">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="roomsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- ADD ROOM MODAL -->
    <div id="addRoomModal" class="modal">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold">Add New Room</h3>
                <button onclick="closeAddRoomModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>
            <form id="addRoomForm" onsubmit="saveRoom(event)">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Room Name</label>
                    <input type="text" id="newRoomName" required placeholder="e.g., Conference Room C" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700 text-sm">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Capacity</label>
                    <input type="number" id="newRoomCapacity" required min="1" placeholder="e.g., 10" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700 text-sm">
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeAddRoomModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-md transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-red-800 hover:bg-red-900 rounded-md transition">Save Room</button>
                </div>
            </form>
        </div>
    </div>

    <!-- BOOK/EDIT ROOM MODAL -->
    <div id="bookRoomModal" class="modal">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 id="bookModalTitle" class="text-lg font-bold">Book Room</h3>
                <button onclick="closeBookRoomModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>
            <form id="bookRoomForm" onsubmit="saveBooking(event)">
                <input type="hidden" id="bookingId">
                
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Select Room</label>
                    <select id="roomSelect" required class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-red-700 text-sm"></select>
                </div>
                
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Assign Instructor</label>
                    <select id="instructorSelect" required class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-red-700 text-sm"></select>
                </div>
                
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Booking Date</label>
                    <input type="date" id="bookingDate" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700 text-sm">
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Start Time</label>
                        <input type="time" id="bookingStartTime" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">End Time</label>
                        <input type="time" id="bookingEndTime" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700 text-sm">
                    </div>
                </div>
                
                <div id="conflictWarning" class="mb-4 p-3 bg-yellow-50 border border-yellow-200 rounded-md text-sm text-yellow-800 hidden">
                    ⚠️ <span id="conflictMessage"></span>
                </div>
                
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Notes / Agenda</label>
                    <textarea id="bookingNotes" rows="3" placeholder="Add meeting details..." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-700 text-sm"></textarea>
                </div>
                
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="removeBookingBtn" onclick="removeBookingFromModal()" class="mr-auto px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-md transition hidden">Remove Assignment</button>
                    <button type="button" onclick="closeBookRoomModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-md transition">Cancel</button>
                    <button type="submit" id="saveBookingBtn" class="px-4 py-2 text-sm font-medium text-white bg-red-800 hover:bg-red-900 rounded-md transition">Save Booking</button>
                </div>
            </form>
        </div>
    </div>

    <!-- NOTIFICATION -->
    <div id="notification" class="notification"></div>

    <script>
        const API_URL = 'api.php';
        let rooms = [];
        let instructors = [];
        let bookings = [];
        let currentDateFilter = 'all';
        let currentFilterDate = new Date();

        // ==================== LOAD DATA ====================
        async function loadData() {
            try {
                const [roomsRes, instructorsRes, bookingsRes] = await Promise.all([
                    fetch(`${API_URL}?endpoint=rooms`),
                    fetch(`${API_URL}?endpoint=instructors`),
                    fetch(`${API_URL}?endpoint=bookings`)
                ]);
                
                const roomsData = await roomsRes.json();
                const instructorsData = await instructorsRes.json();
                const bookingsData = await bookingsRes.json();
                
                if (roomsData.success) rooms = roomsData.rooms;
                if (instructorsData.success) instructors = instructorsData.instructors;
                if (bookingsData.success) {
                    bookings = bookingsData.bookings.map(b => ({
                        id: b.id.toString(),
                        name: b.name,
                        instructor_id: b.instructor_id,
                        instructor_fullname: b.instructor_fullname,
                        instructor_email: b.instructor_email,
                        notes: b.notes || '',
                        booking_date: b.booking_date,
                        start_time: b.start_time,
                        end_time: b.end_time,
                        capacity: b.capacity
                    }));
                }

                updateStats();
                renderTable();
                updateRoomDropdown();
                updateInstructorDropdown();
            } catch (error) {
                console.error('Error:', error);
                showNotification('Failed to load data', 'error');
            }
        }

        // ==================== STATS ====================
        function updateStats() {
            const templateRooms = rooms.filter(r => r.status === 'available' && !r.booking_date);
            const occupiedRooms = rooms.filter(r => r.status === 'occupied');
            
            document.getElementById('totalRooms').innerText = templateRooms.length;
            document.getElementById('availableRooms').innerText = templateRooms.length;
            document.getElementById('occupiedRooms').innerText = occupiedRooms.length;
        }

        // ==================== TABLE ====================
        function renderTable() {
            const tbody = document.getElementById('roomsTableBody');
            const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const filterStatus = document.getElementById('filterStatus')?.value || '';
            
            let displayRooms = getFilteredRooms();
            
            // Apply search
            if (searchTerm) {
                displayRooms = displayRooms.filter(r => r.name.toLowerCase().includes(searchTerm));
            }
            // Apply status filter
            if (filterStatus) {
                displayRooms = displayRooms.filter(r => r.status === filterStatus);
            }
            
            if (displayRooms.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-400">No rooms found</td></tr>';
                return;
            }
            
            tbody.innerHTML = displayRooms.map(room => {
                const booking = room.status === 'occupied' ? room : null;
                
                const statusBadge = room.status === 'available' && !room.booking_date
                    ? '<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-semibold">Available</span>'
                    : '<span class="bg-red-100 text-red-700 px-2 py-1 rounded-full text-xs font-semibold">Occupied</span>';
                
                const dateDisplay = booking?.booking_date ? formatDate(booking.booking_date) : '-';
                const timeDisplay = booking ? `${formatTime(booking.start_time)} - ${formatTime(booking.end_time)}` : '-';
                const instructorDisplay = booking?.instructor_fullname || '-';
                
                let actionsHTML;
                if (room.status === 'available' && !room.booking_date) {
                    actionsHTML = `
                        <button onclick="openBookModal(null, '${escapeHtml(room.name)}')" class="bg-red-800 hover:bg-red-900 text-white px-3 py-1 rounded text-xs font-medium transition">Book</button>
                        <button onclick="deleteRoom(${room.id})" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded text-xs font-medium transition ml-1">Delete</button>
                    `;
                } else {
                    actionsHTML = `
                        <button onclick="openBookModal(${room.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-medium transition">Edit</button>
                        <button onclick="removeBooking(${room.id})" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-medium transition ml-1">Remove</button>
                    `;
                }
                
                return `
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="py-3 px-4 font-medium">🏢 ${escapeHtml(room.name)}</td>
                        <td class="py-3 px-4">${room.capacity}</td>
                        <td class="py-3 px-4">${dateDisplay}</td>
                        <td class="py-3 px-4">${timeDisplay}</td>
                        <td class="py-3 px-4">${escapeHtml(instructorDisplay)}</td>
                        <td class="py-3 px-4">${statusBadge}</td>
                        <td class="py-3 px-4">${actionsHTML}</td>
                    </tr>
                `;
            }).join('');
        }

        // ==================== DATE FILTER ====================
        function setDateFilter(filter) {
            currentDateFilter = filter;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${filter}`)?.classList.add('active');
            
            const label = document.getElementById('dateFilterLabel');
            const today = new Date();
            
            switch(filter) {
                case 'day':
                    currentFilterDate = today;
                    label.innerText = `Showing: ${today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}`;
                    break;
                case 'week':
                    const startOfWeek = new Date(today);
                    startOfWeek.setDate(today.getDate() - today.getDay());
                    const endOfWeek = new Date(startOfWeek);
                    endOfWeek.setDate(startOfWeek.getDate() + 6);
                    currentFilterDate = startOfWeek;
                    label.innerText = `Showing: ${startOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${endOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
                    break;
                case 'month':
                    currentFilterDate = new Date(today.getFullYear(), today.getMonth(), 1);
                    label.innerText = `Showing: ${today.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}`;
                    break;
                default:
                    label.innerText = '';
            }
            
            renderTable();
        }

        function getFilteredRooms() {
            if (currentDateFilter === 'all') return [...rooms];
            
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            // Always show template rooms
            const templateRooms = rooms.filter(r => r.status === 'available' && !r.booking_date);
            
            // Filter occupied rooms by date
            let filteredBookings = rooms.filter(r => r.status === 'occupied' && r.booking_date);
            
            switch(currentDateFilter) {
                case 'day':
                    filteredBookings = filteredBookings.filter(r => r.booking_date === todayStr);
                    break;
                case 'week':
                    const startOfWeek = new Date(today);
                    startOfWeek.setDate(today.getDate() - today.getDay());
                    const startStr = startOfWeek.toISOString().split('T')[0];
                    const endOfWeek = new Date(startOfWeek);
                    endOfWeek.setDate(startOfWeek.getDate() + 6);
                    const endStr = endOfWeek.toISOString().split('T')[0];
                    filteredBookings = filteredBookings.filter(r => r.booking_date >= startStr && r.booking_date <= endStr);
                    break;
                case 'month':
                    const monthStr = today.toISOString().split('T')[0].substring(0, 7); // YYYY-MM
                    filteredBookings = filteredBookings.filter(r => r.booking_date && r.booking_date.startsWith(monthStr));
                    break;
            }
            
            return [...templateRooms, ...filteredBookings];
        }

        // ==================== CONFLICT CHECK ====================
        function checkConflict(roomName, date, startTime, endTime, excludeId = null) {
            return bookings.filter(b => {
                if (b.name !== roomName) return false;
                if (b.booking_date !== date) return false;
                if (excludeId && b.id === excludeId) return false;
                
                // Check time overlap
                return (startTime < b.end_time && endTime > b.start_time);
            });
        }

        // Real-time conflict detection on time change
        document.addEventListener('DOMContentLoaded', () => {
            const startTimeInput = document.getElementById('bookingStartTime');
            const endTimeInput = document.getElementById('bookingEndTime');
            const dateInput = document.getElementById('bookingDate');
            const roomSelect = document.getElementById('roomSelect');
            
            if (startTimeInput && endTimeInput) {
                [startTimeInput, endTimeInput, dateInput].forEach(input => {
                    if (input) {
                        input.addEventListener('change', () => {
                            const roomName = roomSelect?.value;
                            const date = dateInput?.value;
                            const startTime = startTimeInput?.value;
                            const endTime = endTimeInput?.value;
                            const bookingId = document.getElementById('bookingId')?.value;
                            
                            if (roomName && date && startTime && endTime) {
                                const conflicts = checkConflict(roomName, date, startTime, endTime, bookingId || null);
                                const warningDiv = document.getElementById('conflictWarning');
                                const conflictMsg = document.getElementById('conflictMessage');
                                const saveBtn = document.getElementById('saveBookingBtn');
                                
                                if (conflicts.length > 0) {
                                    warningDiv.classList.remove('hidden');
                                    conflictMsg.innerText = `This room is already booked at this time by ${conflicts[0].instructor_fullname || 'someone'} (${conflicts[0].start_time} - ${conflicts[0].end_time}). Please choose a different time.`;
                                    saveBtn.disabled = true;
                                    saveBtn.classList.add('opacity-50', 'cursor-not-allowed');
                                } else {
                                    warningDiv.classList.add('hidden');
                                    saveBtn.disabled = false;
                                    saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                                }
                            }
                        });
                    }
                });
            }
        });

        // ==================== HELPERS ====================
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            const [h, m] = timeStr.split(':');
            const hour = parseInt(h);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            return `${displayHour}:${m} ${ampm}`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        // ==================== EVENTS ====================
        document.getElementById('searchInput')?.addEventListener('input', renderTable);
        document.getElementById('filterStatus')?.addEventListener('change', renderTable);

        // ==================== ADD ROOM ====================
        function openAddRoomModal() {
            document.getElementById('addRoomForm').reset();
            document.getElementById('addRoomModal').classList.add('active');
        }

        function closeAddRoomModal() {
            document.getElementById('addRoomModal').classList.remove('active');
        }

        async function saveRoom(e) {
            e.preventDefault();
            const name = document.getElementById('newRoomName').value.trim();
            const capacity = parseInt(document.getElementById('newRoomCapacity').value) || 0;

            if (!name) return showNotification('Please enter a room name', 'error');
            if (capacity < 1) return showNotification('Capacity must be at least 1', 'error');

            try {
                const res = await fetch(`${API_URL}?endpoint=rooms`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, capacity })
                });
                const data = await res.json();
                
                if (data.success) {
                    showNotification('Room added successfully', 'success');
                    closeAddRoomModal();
                    loadData();
                } else {
                    showNotification(data.error || 'Failed to add room', 'error');
                }
            } catch (error) {
                showNotification('Failed to connect to server', 'error');
            }
        }

        // ==================== DELETE ROOM ====================
        async function deleteRoom(id) {
            if (!confirm('Are you sure you want to delete this room?')) return;
            
            try {
                const res = await fetch(`${API_URL}?endpoint=rooms`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await res.json();
                
                if (data.success) {
                    showNotification('Room deleted', 'success');
                    loadData();
                } else {
                    showNotification(data.error || 'Failed to delete room', 'error');
                }
            } catch (error) {
                showNotification('Failed to connect', 'error');
            }
        }

        // ==================== BOOK ROOM ====================
        function openBookModal(bookingId = null, roomName = null) {
            document.getElementById('bookRoomForm').reset();
            document.getElementById('conflictWarning').classList.add('hidden');
            document.getElementById('saveBookingBtn').disabled = false;
            document.getElementById('saveBookingBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            
            updateRoomDropdown(bookingId);
            updateInstructorDropdown();
            
            if (bookingId) {
                const booking = rooms.find(r => r.id == bookingId);
                if (booking) {
                    document.getElementById('bookModalTitle').innerText = 'Edit Booking';
                    document.getElementById('bookingId').value = booking.id;
                    document.getElementById('roomSelect').value = booking.name;
                    document.getElementById('instructorSelect').value = booking.instructor_id || '';
                    document.getElementById('bookingDate').value = booking.booking_date || '';
                    document.getElementById('bookingStartTime').value = booking.start_time || '';
                    document.getElementById('bookingEndTime').value = booking.end_time || '';
                    document.getElementById('bookingNotes').value = booking.notes || '';
                    document.getElementById('removeBookingBtn').classList.remove('hidden');
                }
            } else {
                document.getElementById('bookModalTitle').innerText = 'Book Room';
                document.getElementById('bookingId').value = '';
                document.getElementById('removeBookingBtn').classList.add('hidden');
                
                if (roomName) document.getElementById('roomSelect').value = roomName;
                
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('bookingDate').value = today;
                document.getElementById('bookingStartTime').value = '09:00';
                document.getElementById('bookingEndTime').value = '10:00';
            }
            
            document.getElementById('bookRoomModal').classList.add('active');
        }

        function closeBookRoomModal() {
            document.getElementById('bookRoomModal').classList.remove('active');
        }

        function updateRoomDropdown(editBookingId = null) {
            const select = document.getElementById('roomSelect');
            if (!select) return;
            
            // Show template rooms + current editing room
            const templateRooms = rooms.filter(r => r.status === 'available' && !r.booking_date);
            const editingRoom = editBookingId ? rooms.find(r => r.id == editBookingId) : null;
            
            let options = templateRooms.map(r => 
                `<option value="${r.name}">${r.name} (Cap: ${r.capacity})</option>`
            );
            
            if (editingRoom && editingRoom.status === 'occupied') {
                options.push(`<option value="${editingRoom.name}" selected>${editingRoom.name} (Cap: ${editingRoom.capacity}) - Editing</option>`);
            }
            
            select.innerHTML = options.join('');
        }

        function updateInstructorDropdown() {
            const select = document.getElementById('instructorSelect');
            if (!select) return;
            
            if (instructors.length === 0) {
                select.innerHTML = '<option value="">No instructors available</option>';
                return;
            }
            
            select.innerHTML = '<option value="">Select Instructor</option>' + 
                instructors.map(i => `<option value="${i.id}">${i.fullname} (${i.email})</option>`).join('');
        }

        async function saveBooking(e) {
            e.preventDefault();
            
            const id = document.getElementById('bookingId').value;
            const name = document.getElementById('roomSelect').value;
            const instructor_id = document.getElementById('instructorSelect').value;
            const booking_date = document.getElementById('bookingDate').value;
            const start_time = document.getElementById('bookingStartTime').value;
            const end_time = document.getElementById('bookingEndTime').value;
            const notes = document.getElementById('bookingNotes').value;

            if (!name) return showNotification('Please select a room', 'error');
            if (!instructor_id) return showNotification('Please select an instructor', 'error');
            if (!booking_date) return showNotification('Please select a date', 'error');
            if (!start_time || !end_time) return showNotification('Please select times', 'error');
            if (start_time >= end_time) return showNotification('End time must be after start time', 'error');

            // Check conflicts before saving
            const conflicts = checkConflict(name, booking_date, start_time, end_time, id || null);
            if (conflicts.length > 0) {
                showNotification(`Time conflict! Room booked ${conflicts[0].start_time}-${conflicts[0].end_time} by ${conflicts[0].instructor_fullname}`, 'error');
                return;
            }

            const bookingData = { name, instructor_id: parseInt(instructor_id), booking_date, start_time, end_time, notes };

            try {
                let res;
                if (id) {
                    bookingData.id = parseInt(id);
                    res = await fetch(`${API_URL}?endpoint=bookings`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bookingData)
                    });
                } else {
                    res = await fetch(`${API_URL}?endpoint=bookings`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bookingData)
                    });
                }
                
                const data = await res.json();
                if (data.success) {
                    showNotification(id ? 'Booking updated' : 'Room booked', 'success');
                    closeBookRoomModal();
                    loadData();
                } else {
                    showNotification(data.error || 'Failed to save booking', 'error');
                }
            } catch (error) {
                showNotification('Failed to connect', 'error');
            }
        }

        // ==================== REMOVE BOOKING ====================
        function removeBookingFromModal() {
            const id = document.getElementById('bookingId').value;
            if (id) removeBooking(parseInt(id));
            closeBookRoomModal();
        }

        async function removeBooking(id) {
            if (!confirm('Are you sure you want to remove this booking?')) return;
            
            try {
                const res = await fetch(`${API_URL}?endpoint=bookings`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await res.json();
                
                if (data.success) {
                    showNotification('Booking removed', 'success');
                    loadData();
                } else {
                    showNotification(data.error || 'Failed', 'error');
                }
            } catch (error) {
                showNotification('Failed to connect', 'error');
            }
        }

        // ==================== NOTIFICATIONS ====================
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            if (!notification) return;
            
            notification.innerText = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        // ==================== LOGOUT ====================
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        function loadCurrentUser() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const el = document.getElementById('currentUser');
            if (el && user.fullname) el.innerText = `Welcome, ${user.fullname}`;
        }

        // ==================== CLOSE MODALS ====================
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', function() {
            loadCurrentUser();
            loadData();
            setDateFilter('all');
        });
    </script>
</body>
</html>
